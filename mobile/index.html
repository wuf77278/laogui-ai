<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#11110f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2311100f'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' fill='%23d4af37'%3E鬼%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./vendor/pannellum/pannellum.css" />
    <title>老鬼AI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2H20a1 1 0 0 1 1 1v10.5A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5Z"/></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 4"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2c.8 5.3 2.7 7.2 8 8-5.3.8-7.2 2.7-8 8-.8-5.3-2.7-7.2-8-8 5.3-.8 7.2-2.7 8-8ZM19 16c.3 2 1 2.7 3 3-2 .3-2.7 1-3 3-.3-2-1-2.7-3-3 2-.3 2.7-1 3-3Z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 15v5h16v-5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5M8 13l8 5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10Z"/><path d="m13.5 7 3.5 3.5"/></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M8 8l-2 2 2 2M16 16l2-2-2-2"/></symbol>
    </svg>

    <div id="app" class="app-shell">
      <header class="topbar">
        <div>
          <span class="brand-mark">老鬼</span>
          <strong>AI 移动创作台</strong>
        </div>
        <button class="icon-button" data-action="quick-camera" aria-label="打开相机"><svg><use href="#i-camera"/></svg></button>
      </header>

      <main id="mainContent" class="main-content">
        <section class="page active" data-page="home" aria-labelledby="homeTitle">
          <div class="hero-card">
            <p class="eyebrow">现场即创作</p>
            <h1 id="homeTitle">拍下空间，立即开始设计</h1>
            <p>保留现场结构，结合参考图和设计风格生成可汇报的方案图。</p>
            <div class="hero-actions">
              <button class="primary-button" data-action="quick-camera"><svg><use href="#i-camera"/></svg>打开相机</button>
              <button class="secondary-button" data-action="quick-gallery"><svg><use href="#i-image"/></svg>从相册选择</button>
            </div>
          </div>
          <div class="section-heading"><div><p class="eyebrow">AI 工具</p><h2>选择创作功能</h2></div></div>
          <div id="toolGrid" class="tool-grid"></div>
        </section>

        <section class="page" data-page="projects" aria-labelledby="projectsTitle">
          <div class="section-heading"><div><p class="eyebrow">本地保存</p><h1 id="projectsTitle">我的项目</h1></div><button class="secondary-button compact" data-action="new-project">新建项目</button></div>
          <div id="projectList" class="project-list empty-state"></div>
        </section>

        <section class="page" data-page="tasks" aria-labelledby="tasksTitle">
          <div class="section-heading"><div><p class="eyebrow">生成进度</p><h1 id="tasksTitle">任务记录</h1></div></div>
          <div id="taskList" class="task-list empty-state"></div>
        </section>

        <section class="page" data-page="settings" aria-labelledby="settingsTitle">
          <div class="section-heading"><div><p class="eyebrow">只需设置一次</p><h1 id="settingsTitle">API 设置</h1></div></div>
          <form id="settingsForm" class="settings-form">
            <article class="settings-card"><div><strong>FHL</strong><span>第一线路</span></div><label>API 密钥<input id="fhlKey" type="password" autocomplete="off" placeholder="sk-..." /></label></article>
            <article class="settings-card"><div><strong>YYBB</strong><span>第二线路</span></div><label>API 密钥<input id="yybbKey" type="password" autocomplete="off" placeholder="sk-..." /></label></article>
            <article class="settings-card"><div><strong>万物</strong><span>第三线路</span></div><label>API 密钥<input id="aiwanwuKey" type="password" autocomplete="off" placeholder="sk-..." /></label></article>
            <p class="privacy-note">密钥使用安卓系统加密保存在这台手机中。生图时由手机直接连接接口，不需要中转服务。</p>
            <button class="primary-button" type="submit"><svg><use href="#i-check"/></svg>保存设置</button>
            <p id="settingsStatus" class="form-status" aria-live="polite"></p>
          </form>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="主要导航">
        <button class="active" data-nav="home"><svg><use href="#i-home"/></svg><span>首页</span></button>
        <button data-nav="projects"><svg><use href="#i-folder"/></svg><span>项目</span></button>
        <button data-nav="tasks"><svg><use href="#i-tasks"/></svg><span>任务</span><i id="taskBadge" hidden></i></button>
        <button data-nav="settings"><svg><use href="#i-settings"/></svg><span>设置</span></button>
      </nav>
    </div>

    <dialog id="composerDialog" class="sheet-dialog">
      <form method="dialog" class="sheet-head"><button class="icon-button" value="cancel" aria-label="返回"><svg><use href="#i-back"/></svg></button><div><p class="eyebrow">AI 创作</p><h2 id="composerTitle">现场图转效果图</h2></div><button class="icon-button" value="cancel" aria-label="关闭"><svg><use href="#i-close"/></svg></button></form>
      <div class="sheet-body">
        <section class="input-section"><div class="field-title"><strong>底图</strong><span>必选</span></div><div id="primaryPreview" class="image-input-preview empty"><span>添加现场图、图纸、白模或手稿</span></div><div id="maskEditorControls" class="mask-editor-controls" hidden><label>画笔大小<input id="maskBrushSize" type="range" min="12" max="120" value="48" /></label><button id="clearMaskButton" class="secondary-button" type="button">清除选区</button><p>用手指涂抹需要消除或替换的位置。</p></div><div class="input-actions"><button class="primary-button" data-action="camera-primary"><svg><use href="#i-camera"/></svg>拍照</button><button class="secondary-button" data-action="gallery-primary"><svg><use href="#i-image"/></svg>相册</button></div></section>
        <section class="input-section"><div class="field-title"><strong>参考图</strong><span id="referenceCount">0 / 8</span></div><div id="referencePreviews" class="reference-previews"></div><div class="input-actions"><button class="secondary-button" data-action="camera-reference"><svg><use href="#i-camera"/></svg>拍参考图</button><button class="secondary-button" data-action="gallery-reference"><svg><use href="#i-image"/></svg>从相册添加</button></div></section>
        <section class="input-section"><div class="field-title"><strong>常用风格</strong><span>单选</span></div><div id="styleChips" class="chip-row"></div></section>
        <label class="field">设计要求<textarea id="promptInput" rows="4" placeholder="例如：保留原始布局，改造成自然原木风民宿大堂，暖色洗墙灯，无人。"></textarea></label>
        <div class="two-fields"><label class="field">结构保留<select id="structureSelect"><option value="high">高：严格保留</option><option value="medium">中：保留主要关系</option><option value="creative">低：允许发挥</option></select></label><label class="field">图片比例<select id="ratioSelect"><option value="auto">参考原图</option><option value="1:1">1:1</option><option value="3:4">3:4</option><option value="4:5">4:5</option><option value="16:9">16:9</option><option value="2:1">2:1 全景</option></select></label></div>
        <section id="angleControls" class="input-section angle-controls" hidden><div class="field-title"><strong>平面图角度</strong><span>手指拖动滑杆</span></div><label class="field">左右旋转 <output id="yawValue">35°</output><input id="yawRange" type="range" min="-60" max="60" value="35" /></label><label class="field">俯视角度 <output id="pitchValue">55°</output><input id="pitchRange" type="range" min="25" max="80" value="55" /></label></section>
        <details class="strategy-panel"><summary>查看设计策略</summary><div id="strategyContent"></div></details>
        <button id="generateButton" class="primary-button generate-button" type="button"><svg><use href="#i-spark"/></svg>生成1张图片</button>
      </div>
    </dialog>

    <dialog id="projectDialog" class="sheet-dialog"><form method="dialog" class="sheet-head"><button class="icon-button" value="cancel"><svg><use href="#i-back"/></svg></button><div><p class="eyebrow">项目图片流</p><h2 id="projectDialogTitle">项目</h2></div><button class="icon-button" value="cancel"><svg><use href="#i-close"/></svg></button></form><div id="projectTimeline" class="sheet-body timeline"></div></dialog>
    <dialog id="imageDialog" class="image-dialog"><form method="dialog"><button class="icon-button close-float" value="cancel"><svg><use href="#i-close"/></svg></button></form><img id="imageDialogImage" alt="图片预览"/><div id="panoramaViewer" class="panorama-viewer" hidden></div><div class="image-actions"><button data-image-action="edit"><svg><use href="#i-edit"/></svg>AI编辑</button><button data-image-action="reuse"><svg><use href="#i-spark"/></svg>继续生成</button><button data-image-action="compare"><svg><use href="#i-compare"/></svg>原图对比</button><button data-image-action="share"><svg><use href="#i-share"/></svg>分享</button></div></dialog>
    <dialog id="compareDialog" class="compare-dialog"><form method="dialog"><button class="icon-button close-float" value="cancel"><svg><use href="#i-close"/></svg></button></form><div><figure><img id="compareOriginal" alt="生成前原图"><figcaption>生成前</figcaption></figure><figure><img id="compareResult" alt="生成后效果"><figcaption>生成后</figcaption></figure></div></dialog>
    <input id="galleryPrimaryInput" type="file" accept="image/*" hidden />
    <input id="galleryReferenceInput" type="file" accept="image/*" multiple hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./vendor/pannellum/pannellum.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
