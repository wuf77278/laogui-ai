<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="./assets/laogui-ai-favicon.svg">
  <title>老鬼AI手机端｜UI探索原型</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1d1c19;background:#171714}button{font:inherit}
    .studio{min-height:100vh;display:grid;grid-template-columns:320px 1fr;background:#171714}.panel{padding:28px 24px;color:#f6f3ea;border-right:1px solid #39372f;background:#21211d}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand img{width:44px;height:44px;object-fit:contain;background:#f2ead8;border-radius:8px}.brand strong{display:block;font-size:20px}.brand small{color:#aaa69a}.panel h1{font-size:17px;margin:0 0 8px}.panel>p{font-size:13px;line-height:1.7;color:#aaa69a;margin:0 0 22px}.scheme-list{display:grid;gap:8px}.scheme-button{width:100%;display:grid;grid-template-columns:32px 1fr;gap:10px;text-align:left;padding:12px;border:1px solid #403e36;border-radius:8px;color:#d7d3c9;background:#282822;cursor:pointer}.scheme-button span{font-size:12px;color:#c8a44b}.scheme-button small{display:block;margin-top:4px;color:#8f8b81}.scheme-button.active{color:#17130b;border-color:#c8a44b;background:#d7b85f}.scheme-button.active span,.scheme-button.active small{color:#5a4514}.legend{margin-top:22px;padding-top:18px;border-top:1px solid #39372f;font-size:12px;color:#9e9a90;line-height:1.7}
    .stage{min-width:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 15%,#39382f 0,#22221e 43%,#171714 100%)}.device-wrap{display:grid;gap:14px;justify-items:center}.device-title{width:min(390px,calc(100vw - 32px));display:flex;justify-content:space-between;color:#d8d4c9;font-size:12px}.device{position:relative;width:390px;height:844px;overflow:hidden;border:1px solid #555145;border-radius:36px;background:#f5f4ef;box-shadow:0 28px 80px #0008}.screen{position:absolute;inset:0;padding:20px 20px 92px;overflow:hidden;background:var(--bg,#f5f4ef);color:var(--ink,#20201d);transition:opacity .2s,transform .24s}.screen[hidden]{display:block;opacity:0;pointer-events:none;transform:translateX(18px)}.status{height:28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}.top{display:flex;align-items:center;justify-content:space-between;margin:14px 0 20px}.top h2{margin:0;font-size:25px;letter-spacing:0}.top small{display:block;margin-top:4px;color:var(--muted,#747168)}.icon{width:42px;height:42px;border:1px solid #d8d5cd;border-radius:50%;background:#fff;color:inherit;cursor:pointer}.hero{position:relative;height:310px;overflow:hidden;border-radius:8px;background:#292a27}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,#000a)}.hero-label{position:absolute;z-index:1;left:16px;bottom:14px;color:#fff}.hero-label strong{display:block;font-size:17px}.hero-label small{opacity:.8}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-title strong{font-size:15px}.section-title small{color:var(--muted,#747168)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{min-height:92px;padding:13px 10px;border:1px solid #dedbd3;border-radius:8px;text-align:left;color:inherit;background:#fff;cursor:pointer}.action b{display:block;width:30px;height:30px;margin-bottom:10px;padding-top:5px;border-radius:50%;text-align:center;color:#1a160b;background:#d4ad4f}.action span{font-size:13px;font-weight:700}.composer{position:absolute;z-index:4;left:18px;right:18px;bottom:88px;height:70px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border:1px solid #d5d1c6;border-radius:22px;background:#ffffffef;box-shadow:0 12px 28px #2b26171a}.composer span{flex:1;color:#7b776d;font-size:14px}.primary{height:48px;padding:0 20px;border:0;border-radius:8px;font-weight:750;color:#1d1709;background:#d0a844;cursor:pointer}.round{width:48px;padding:0;border-radius:50%}.bottom-nav{position:absolute;z-index:5;left:0;right:0;bottom:0;height:78px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #dedbd2;background:#fbfaf6ee;backdrop-filter:blur(18px)}.bottom-nav button{width:78px;border:0;color:#77736a;background:none;font-size:11px;cursor:pointer}.bottom-nav b{display:block;margin-bottom:5px;font-size:19px}.bottom-nav .active{color:#9d7419}
    .sheet-screen{padding:0;background:#0008}.sheet{position:absolute;left:0;right:0;bottom:0;height:724px;padding:12px 20px 100px;border-radius:24px 24px 0 0;background:#f7f5ef;box-shadow:0 -20px 50px #0003}.grab{width:38px;height:4px;margin:0 auto 18px;border-radius:4px;background:#c9c5ba}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;font-size:22px}.input-card{margin-top:18px;padding:16px;border:1px solid #d8d4ca;border-radius:8px;background:#fff}.input-card label{display:block;margin-bottom:9px;font-size:13px;font-weight:700}.input-card textarea{width:100%;height:86px;resize:none;border:0;outline:0;font:inherit;color:#292722}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0}.chip{white-space:nowrap;padding:9px 13px;border:1px solid #d7d3c9;border-radius:999px;background:#fff;cursor:pointer}.chip.active{border-color:#b68a24;color:#5b4211;background:#f2dfaa}.upload-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.upload{height:104px;border:1px dashed #bcb7ab;border-radius:8px;color:#777268;background:#eeece5}.sheet-footer{position:absolute;left:20px;right:20px;bottom:30px}.sheet-footer .primary{width:100%}
    .progress-screen{display:grid;place-items:center;padding:80px 28px;background:#1b1b18;color:#f4f0e6}.progress-orbit{position:relative;width:156px;height:156px;border:1px solid #5f594a;border-radius:50%}.progress-orbit:before{content:"";position:absolute;inset:14px;border:3px solid transparent;border-top-color:#d0a844;border-right-color:#d0a844;border-radius:50%;animation:spin 1.5s linear infinite}.progress-orbit b{position:absolute;inset:0;display:grid;place-items:center;font-size:25px}@keyframes spin{to{transform:rotate(360deg)}}.progress-screen h2{margin:28px 0 8px}.progress-screen p{margin:0;color:#aaa69a}.steps{width:100%;margin-top:38px;display:grid;gap:12px}.step{display:flex;align-items:center;gap:11px;color:#858177}.step.done{color:#e7cf8a}.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
    .result-tools{display:flex;gap:8px;margin-top:12px}.result-tools button{flex:1;height:54px;border:1px solid #d6d2c8;border-radius:8px;background:#fff}.compare{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:410px;overflow:hidden;border-radius:8px}.compare img{width:100%;height:100%;object-fit:cover}.edit-canvas{position:relative;height:492px;overflow:hidden;border-radius:8px;background:#1d1d1b}.edit-canvas img{width:100%;height:100%;object-fit:cover;opacity:.86}.mask{position:absolute;left:120px;top:190px;width:110px;height:88px;border:2px solid #e4bd57;border-radius:52% 44% 48% 42%;background:#e4bd5740;box-shadow:0 0 0 8px #e4bd571b}.tool-row{display:flex;gap:8px;margin-top:12px}.tool-row button{flex:1;height:54px;border:1px solid #d4d0c6;border-radius:8px;background:#fff}.tool-row .active{color:#1d1607;background:#d0a844}.project-list{display:grid;gap:12px}.project{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:10px;border:1px solid #ddd9cf;border-radius:8px;background:#fff}.project img{width:96px;height:82px;object-fit:cover;border-radius:6px}.project h3{margin:7px 0 6px;font-size:15px}.project p{margin:0;color:#77736a;font-size:12px}.project small{display:block;margin-top:11px;color:#a37b22}
    .concept-only .hero{height:350px}.concept-only .concept-note{margin-top:18px;padding:15px;border-left:3px solid var(--accent);background:#ffffffb8;font-size:13px;line-height:1.7}.concept-only .primary{position:absolute;left:20px;right:20px;bottom:104px;width:350px}.scheme-2{--bg:#eff5f2;--ink:#10231f;--muted:#65736e;--accent:#2c8b73}.scheme-2 .primary,.scheme-2 .action b{background:#51a990}.scheme-3{--bg:#f1f2f7;--ink:#171b2b;--muted:#697087;--accent:#526cc2}.scheme-3 .primary,.scheme-3 .action b{background:#8397dd}.scheme-4{--bg:#f7f1ed;--ink:#2a1812;--muted:#806b64;--accent:#bf573e}.scheme-4 .primary,.scheme-4 .action b{background:#d87a63}.scheme-5{--bg:#1b1c1e;--ink:#f0eee8;--muted:#a7a39a;--accent:#d0a844}.scheme-5 .action,.scheme-5 .concept-note{border-color:#3d3c38;background:#27282a}.scheme-5 .bottom-nav{border-color:#3d3c38;background:#202123ee}.scheme-6{--bg:#f0eadc;--ink:#211a10;--muted:#756a58;--accent:#8b2520}.scheme-6 .primary,.scheme-6 .action b{color:#fff;background:#8b2520}
    @media(max-width:760px){.studio{height:100dvh;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;overflow:hidden}.panel{min-width:0;padding:10px 10px 8px;border:0;overflow:hidden}.brand,.panel>p,.panel h1,.legend{display:none}.scheme-list{width:100%;display:flex;overflow:auto}.scheme-button{min-width:154px;padding:9px}.stage{min-width:0;min-height:0;padding:0;background:#171714}.device-wrap{width:100%;height:100%;gap:0}.device-title{display:none}.device{width:100vw;height:100%;border:0;border-radius:0}.screen{padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(92px,env(safe-area-inset-bottom))}.hero{height:270px}.concept-only .hero{height:290px}}
  </style>
</head>
<body>
  <main class="studio">
    <aside class="panel">
      <div class="brand"><img src="./assets/laogui-design-logo-transparent.png" alt="老鬼设计"><div><strong>老鬼AI手机端</strong><small>6 套界面方向</small></div></div>
      <h1>先比较，再体验推荐方案</h1><p>点击左侧方案可切换。第 1 套是推荐的完整交互原型，其余 5 套用于比较布局和产品气质。</p>
      <div class="scheme-list" id="schemeList"></div>
      <div class="legend">推荐结论：采用“极简画布 + AI 对话”的混合方案。核心参数放进底部抽屉，画布始终保持可见。</div>
    </aside>
    <section class="stage">
      <div class="device-wrap"><div class="device-title"><span id="schemeName">01 推荐方案 · 极简画布</span><span>可点击原型</span></div><div class="device" id="device"></div></div>
    </section>
  </main>
  <script>
    const schemes=[
      {name:'推荐方案 · 极简画布',desc:'画布优先，参数进抽屉',kind:'prototype'},
      {name:'AI 对话创作',desc:'像聊天一样完成设计',kind:'concept',className:'scheme-2',note:'适合第一次使用 AI 的用户。优点是上手简单；代价是精细参数入口更深。'},
      {name:'项目工作台',desc:'以项目和任务为核心',kind:'concept',className:'scheme-3',note:'适合同时管理多个项目。优点是资料清晰；代价是单次创作路径稍长。'},
      {name:'灵感瀑布流',desc:'先找风格再开始创作',kind:'concept',className:'scheme-4',note:'适合灵感探索和风格复用。优点是视觉吸引力强；代价是容易弱化专业编辑能力。'},
      {name:'专业编辑器',desc:'工具常驻，面向高频用户',kind:'concept',className:'scheme-5',note:'适合长期高频使用。优点是效率高；代价是手机屏幕上学习成本最高。'},
      {name:'东方品牌感',desc:'强化老鬼个人设计语言',kind:'concept',className:'scheme-6',note:'适合品牌展示和客户沟通。优点是辨识度高；代价是通用工具感会弱一些。'}
    ];
    const assets=['./assets/home/ai-space-canvas-hero.png','./assets/laogui-architecture-ui/03-architecture-massing-study.png','./assets/library/scene-hospitality-lounge.png'];
    const list=document.querySelector('#schemeList'),device=document.querySelector('#device'),schemeName=document.querySelector('#schemeName');
    schemes.forEach((s,i)=>{const b=document.createElement('button');b.className='scheme-button';b.innerHTML=`<span>0${i+1}</span><div>${s.name}<small>${s.desc}</small></div>`;b.onclick=()=>showScheme(i);list.appendChild(b)});
    const status=`<div class="status"><span>9:41</span><span>● ● ▰</span></div>`;
    const nav=`<nav class="bottom-nav"><button class="active" data-go="home"><b>◇</b>画布</button><button data-go="projects"><b>▱</b>项目</button><button><b>◎</b>我的</button></nav>`;
    function home(){return `<section class="screen" data-screen="home">${status}<header class="top"><div><h2>今天设计什么？</h2><small>当前画布 · 杭州民宿</small></div><button class="icon">•••</button></header><div class="hero"><img src="${assets[0]}"><div class="hero-label"><strong>空间创作画布</strong><small>点击图片可进入编辑</small></div></div><div class="section-title"><strong>快速开始</strong><small>常用能力</small></div><div class="actions"><button class="action" data-go="sheet"><b>＋</b><span>上传底图</span></button><button class="action" data-go="sheet"><b>✦</b><span>AI 改图</span></button><button class="action" data-go="projects"><b>▱</b><span>历史项目</span></button></div><button class="composer" data-go="sheet"><span>说出你想要的空间效果</span><i class="primary round">↑</i></button>${nav}</section>`}
    function sheet(){return `<section class="screen sheet-screen" data-screen="sheet" hidden><div class="sheet"><div class="grab"></div><header class="sheet-head"><div><small>AI 设计策略</small><h2>生成空间方案</h2></div><button class="icon" data-go="home">×</button></header><div class="input-card"><label>生成要求</label><textarea>把客厅改成现代东方风格，保留原有门窗和主要结构，增加自然木与柔和灯光。</textarea></div><div class="section-title"><strong>设计风格</strong><small>可多选</small></div><div class="chips"><button class="chip active">现代东方</button><button class="chip">侘寂</button><button class="chip">自然原木</button></div><div class="section-title"><strong>图片参考</strong><small>1 / 8</small></div><div class="upload-row"><button class="upload">底图 ✓</button><button class="upload">＋ 参考图</button><button class="upload">＋ 材质图</button></div><div class="section-title"><strong>输出设置</strong><small>4 张 · 高清</small></div><div class="chips"><button class="chip active">参考原图</button><button class="chip">4:5</button><button class="chip">16:9</button><button class="chip active">2K</button></div><div class="sheet-footer"><button class="primary" data-go="progress">开始生成 4 张方案</button></div></div></section>`}
    function progress(){return `<section class="screen progress-screen" data-screen="progress" hidden><div><div class="progress-orbit"><b>68%</b></div><h2>正在生成空间方案</h2><p>预计还需要约 18 秒</p><div class="steps"><div class="step done"><i class="dot"></i>读取空间结构</div><div class="step done"><i class="dot"></i>匹配风格与材质</div><div class="step"><i class="dot"></i>渲染 4 张高清图片</div></div><button class="primary" style="width:100%;margin-top:38px" data-go="result">查看模拟结果</button></div></section>`}
    function result(){return `<section class="screen" data-screen="result" hidden>${status}<header class="top"><div><h2>生成结果</h2><small>4 张方案 · 已保存</small></div><button class="icon" data-go="home">×</button></header><div class="compare"><img src="${assets[1]}"><img src="${assets[2]}"></div><div class="section-title"><strong>方案 02</strong><small>左右滑动查看</small></div><div class="result-tools"><button>保存</button><button data-go="edit">AI 局部编辑</button><button>继续生成</button></div>${nav}</section>`}
    function edit(){return `<section class="screen" data-screen="edit" hidden>${status}<header class="top"><div><h2>AI 局部编辑</h2><small>涂抹需要修改的区域</small></div><button class="icon" data-go="result">←</button></header><div class="edit-canvas"><img src="${assets[2]}"><i class="mask"></i></div><div class="tool-row"><button class="active">画笔</button><button>擦除</button><button>智能消除</button></div><button class="composer" data-go="result"><span>把沙发换成深色皮革</span><i class="primary round">↑</i></button></section>`}
    function projects(){return `<section class="screen" data-screen="projects" hidden>${status}<header class="top"><div><h2>历史项目</h2><small>3 个项目 · 26 次生成</small></div><button class="icon">＋</button></header><div class="project-list"><article class="project"><img src="${assets[0]}"><div><h3>杭州民宿</h3><p>12 张图片 · 今天更新</p><small>3 个任务进行中</small></div></article><article class="project"><img src="${assets[1]}"><div><h3>上海办公空间</h3><p>8 张图片 · 昨天更新</p><small>已完成</small></div></article><article class="project"><img src="${assets[2]}"><div><h3>北京展厅</h3><p>6 张图片 · 8月10日更新</p><small>查看项目</small></div></article></div>${nav}</section>`}
    function concept(i){const s=schemes[i];const titles=['','像聊天一样设计','把每个项目管清楚','从灵感开始创作','随时进入专业编辑','让老鬼成为第一视觉'];const ctas=['','开始一段设计对话','新建项目','复用这个风格','打开编辑器','进入老鬼设计场'];return `<section class="screen concept-only ${s.className}">${status}<header class="top"><div><h2>${titles[i]}</h2><small>${s.desc}</small></div><button class="icon">•••</button></header><div class="hero"><img src="${assets[i%3]}"><div class="hero-label"><strong>${s.name}</strong><small>方向预览</small></div></div><div class="concept-note">${s.note}</div><button class="primary">${ctas[i]}</button>${nav}</section>`}
    function bind(){device.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));device.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('active'))}
    function go(name){device.querySelectorAll('[data-screen]').forEach(s=>s.hidden=s.dataset.screen!==name);bind()}
    function showScheme(i){[...list.children].forEach((b,n)=>b.classList.toggle('active',n===i));schemeName.textContent=`0${i+1} ${schemes[i].name}`;device.innerHTML=i===0?home()+sheet()+progress()+result()+edit()+projects():concept(i);bind()}
    showScheme(0);
  </script>
</body>
</html>
